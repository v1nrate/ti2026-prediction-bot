services:
  - type: web
    name: ti2026-prediction-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: CHECK_INTERVAL_SECONDS
        value: "120"
      - key: OPENDOTA_LEAGUE_ID
        value: "19719"
      - key: OPENDOTA_API_KEY
        sync: false
